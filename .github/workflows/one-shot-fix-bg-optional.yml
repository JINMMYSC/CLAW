name: One-shot fix optional keyboard background

on:
  push:
    branches:
      - work/claw-voice-keyboard-bg
    paths:
      - .github/workflows/one-shot-fix-bg-optional.yml

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: work/claw-voice-keyboard-bg
          fetch-depth: 0

      - name: Patch optional keyboard background
        shell: python
        run: |
          from pathlib import Path
          path = Path("Packages/HamsterKeyboardKit/Sources/Controller/KeyboardInputViewController.swift")
          text = path.read_text()
          old = "backgroundColor = keyboardAppearance.backgroundStyle.backgroundColor"
          new = "backgroundColor = keyboardAppearance.backgroundStyle.backgroundColor ?? ClawPanelPalette.keyboardBackground"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one match, found {count}")
          path.write_text(text.replace(old, new, 1))

      - name: Verify patch
        run: |
          set -euo pipefail
          grep -F 'backgroundColor = keyboardAppearance.backgroundStyle.backgroundColor ?? ClawPanelPalette.keyboardBackground' Packages/HamsterKeyboardKit/Sources/Controller/KeyboardInputViewController.swift
          git diff --check

      - name: Commit source fix and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-bg-optional.yml
          git add Packages/HamsterKeyboardKit/Sources/Controller/KeyboardInputViewController.swift
          git commit -m "fix: handle optional keyboard background color"
          git push origin HEAD:work/claw-voice-keyboard-bg

      - name: Dispatch signed IPA and startup smoke on new HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-ipa.yml --ref work/claw-voice-keyboard-bg
          gh workflow run startup-smoke.yml --ref work/claw-voice-keyboard-bg
