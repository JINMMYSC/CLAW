name: iOS Startup Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, work/claw-voice-keyboard-bg, work/claw-productization-20261006, 'work/claw-ux-*', 'feature/claw-ipa-build-candidate-*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Rime frameworks
        run: |
          set -euo pipefail
          mkdir -p Frameworks
          cd Frameworks
          base="https://github.com/zhanggenlove/LibrimeKit/releases/download/v0.1.0"
          # Match Build Test and Signed IPA: all nine exact pinned libraries.
          for name in librime boost_atomic boost_filesystem boost_regex boost_system libleveldb libmarisa libopencc libyaml-cpp; do
            case "$name" in
              librime) sha="869ad448db92be5855e239f6f61a87d87e84974a4668509a3cbe4d766f294a54" ;;
              boost_atomic) sha="4db32b1015c0b2df5b55042e5ec2cced674f8e54e083f7d4aeb1e7db3a6c6925" ;;
              boost_filesystem) sha="d22bfd6aa9dd37333710aa5cea19fb065ab270bf2e55551841193bfac5b52af1" ;;
              boost_regex) sha="8b13fb6da177e777b76cc9e02d1aed342f922cb3c24f3029e3879f3c2f82fe33" ;;
              boost_system) sha="cb3a7cb48499686024923eef902c4327bb021eb8ef25da602a713b9108f56365" ;;
              libleveldb) sha="147cd30ee8763ccea573ca9778a5b2ed420c3adf5c91fe1b171fd1799422d103" ;;
              libmarisa) sha="cf66bb44fe11d5bc9ce39d61212e5f269bc4cc5045250bc79d62e34205bfc3bb" ;;
              libopencc) sha="715f2a323cc3f2b5aaeb3158533fc52ede265dbb54b07ea82f586c68604fe914" ;;
              libyaml-cpp) sha="4c277cc6fa3f7330200f16d4454cd77c43c495714465bcb0d506d07d5fcdcc4c" ;;
              *) echo "Unpinned RIME asset: $name" >&2; exit 1 ;;
            esac
            curl --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 120 -fL -o "$name.xcframework.zip" "$base/$name.xcframework.zip"
            printf '%s  %s\n' "$sha" "$name.xcframework.zip" | shasum -a 256 -c -
            unzip -oq "$name.xcframework.zip"
            rm "$name.xcframework.zip"
          done

      - name: Build Rime schemas
        run: bash InputSchemaBuild.sh

      - name: Select and boot simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)["devices"]
          for runtime in reversed(list(data.values())):
              for device in runtime:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator")')
          echo "SIMULATOR_UDID=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b

      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Hamster.xcodeproj \
            -scheme Hamster \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath smoke-dd \
            CODE_SIGNING_ALLOWED=NO | tee smoke-build.log

      - name: Seed first-launch data
        run: |
          set -euo pipefail
          app=$(find smoke-dd/Build/Products -maxdepth 2 -name Hamster.app | head -1)
          test -n "$app"
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          rm -f smoke-first-launch-console.log
          xcrun simctl launch --console "$SIMULATOR_UDID" app.lgm.7517 \
            >smoke-first-launch-console.log 2>&1 &
          monitor=$!
          # A first-install RIME deployment can stall transiently on a busy
          # hosted simulator. Retry once with the same installed app; do not
          # skip readiness, liveness, or the later migration/UI assertions.
          ready=0
          for attempt in 1 2; do
            if [ "$attempt" -eq 2 ]; then
              echo "First-launch did not become ready after 240s; retrying once"
              kill "$monitor" 2>/dev/null || true
              xcrun simctl terminate "$SIMULATOR_UDID" app.lgm.7517 || true
              wait "$monitor" 2>/dev/null || true
              xcrun simctl launch --console "$SIMULATOR_UDID" app.lgm.7517 \
                >smoke-first-launch-retry-console.log 2>&1 &
              monitor=$!
              current_log=smoke-first-launch-retry-console.log
            else
              current_log=smoke-first-launch-console.log
            fi
            for _ in $(seq 1 48); do
              sleep 5
              if grep -Eq "\[clawTalk\] first-launch (ready|deployment completed)$" "$current_log"; then
                ready=1
                break
              fi
              if ! kill -0 "$monitor" 2>/dev/null; then
                echo "App exited while seeding first-launch data (attempt $attempt)"
                cat "$current_log"
                exit 1
              fi
            done
            if [ "$ready" -eq 1 ]; then break; fi
            echo "First-launch attempt $attempt timed out; recent stages:"
            grep "claw-bootstrap:" "$current_log" | tail -n 12 || true
          done
          if [ "$ready" -ne 1 ]; then
            echo "First-launch deployment did not complete after two 240s attempts"
            cat smoke-first-launch-console.log
            if [ -f smoke-first-launch-retry-console.log ]; then
              cat smoke-first-launch-retry-console.log
            fi
            exit 1
          fi
          kill "$monitor" 2>/dev/null || true
          xcrun simctl terminate "$SIMULATOR_UDID" app.lgm.7517 || true
          wait "$monitor" 2>/dev/null || true

      - name: Launch legacy migration regression
        run: |
          set -euo pipefail
          rm -f smoke-console.log
          rm -f smoke-screen-start.png smoke-screen-45s.png
          xcrun simctl launch --console "$SIMULATOR_UDID" app.lgm.7517 \
            -clawTalkForceV1Migration \
            >smoke-console.log 2>&1 &
          monitor=$!
          migration_started=0
          for _ in $(seq 1 18); do
            sleep 5
            if grep -q "clawtalk-v1-migration: start" smoke-console.log; then
              migration_started=1
              break
            fi
            if ! kill -0 "$monitor" 2>/dev/null; then
              echo "App exited while waiting for the legacy v1 migration"
              cat smoke-console.log
              exit 1
            fi
          done
          if [ "$migration_started" -ne 1 ]; then
            echo "Legacy v1 migration did not start within 90 seconds"
            cat smoke-console.log
            exit 1
          fi
          xcrun simctl io "$SIMULATOR_UDID" screenshot smoke-screen-start.png
          sleep 33
          if ! kill -0 "$monitor" 2>/dev/null; then
            echo "App exited during the 45-second startup window"
            cat smoke-console.log
            exit 1
          fi
          xcrun simctl io "$SIMULATOR_UDID" screenshot smoke-screen-45s.png
          python3 -m venv "$RUNNER_TEMP/claw-smoke-py"
          "$RUNNER_TEMP/claw-smoke-py/bin/python" -m pip install --disable-pip-version-check --quiet "Pillow==11.3.0"
          "$RUNNER_TEMP/claw-smoke-py/bin/python" - <<'PY'
          try:
              from PIL import Image
          except ImportError as exc:
              raise SystemExit("Pillow unavailable; black-screen check cannot be skipped") from exc
          def dark_ratio(path):
              img = Image.open(path).convert("L")
              px = img.load()
              w, h = img.size
              dark = 0
              total = 0
              for y in range(0, h, 4):
                  for x in range(0, w, 4):
                      total += 1
                      if px[x, y] < 24:
                          dark += 1
              return dark / total
          rstart = dark_ratio("smoke-screen-start.png")
          r45 = dark_ratio("smoke-screen-45s.png")
          print(f"dark_ratio start={rstart:.3f} 45s={r45:.3f}")
          if r45 > 0.97:
              print("SCREEN IS BLACK: launch overlay did not dismiss within 45s")
              sys.exit(1)
          PY
          if ! grep -q "\[clawTalk\] v1 migration completed" smoke-console.log; then
            echo "Legacy v1 migration did not complete"
            cat smoke-console.log
            exit 1
          fi
          kill "$monitor" || true
          xcrun simctl terminate "$SIMULATOR_UDID" app.lgm.7517 || true
          wait "$monitor" 2>/dev/null || true

      - name: Capture native assistant composer states
        run: |
          set -euo pipefail
          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          for state in empty text multiline voice emoji more dark; do
            if [ "$state" = dark ]; then
              xcrun simctl ui "$SIMULATOR_UDID" appearance dark
            fi
            # Each UI state needs fresh process arguments; do not reuse the
            # prior simulator process with an outdated screenshot fixture.
            xcrun simctl launch --terminate-running-process --console "$SIMULATOR_UDID" app.lgm.7517 \
              -clawComposerScreenshot "$state" \
              >"composer-$state.log" 2>&1 &
            monitor=$!
            ready=0
            for _ in $(seq 1 30); do
              sleep 1
              if grep -Fq "[clawComposer] screenshot ready: $state" "composer-$state.log"; then
                ready=1
                break
              fi
              if ! kill -0 "$monitor" 2>/dev/null; then
                echo "App exited while preparing composer state: $state"
                cat "composer-$state.log"
                exit 1
              fi
            done
            if [ "$ready" -ne 1 ]; then
              echo "Composer state did not become ready within 30 seconds: $state"
              cat "composer-$state.log"
              exit 1
            fi
            xcrun simctl io "$SIMULATOR_UDID" screenshot "composer-$state.png"
            kill "$monitor" 2>/dev/null || true
            xcrun simctl terminate "$SIMULATOR_UDID" app.lgm.7517 || true
            wait "$monitor" 2>/dev/null || true
          done
          xcrun simctl ui "$SIMULATOR_UDID" appearance light

      - name: Reject obscured startup and composer screenshots
        run: |
          set -euo pipefail
          # The simulator can show an OS Speech Recognition dialog even when
          # composer readiness logs are green. Verify the captured pixels.
          xcrun swift scripts/verify_smoke_ui_alerts.swift \
            smoke-screen-start.png smoke-screen-45s.png composer-*.png

      - name: Upload native assistant composer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claw-composer-screenshots
          path: composer-*.png
          if-no-files-found: warn

      - name: Capture diagnostics
        if: always()
        run: |
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 3m \
            --style compact \
            --predicate 'process == "Hamster" OR eventMessage CONTAINS "app.lgm.7517"' \
            > smoke-system.log || true
          find "$HOME/Library/Logs/DiagnosticReports" -type f \
            \( -name 'Hamster*.crash' -o -name 'Hamster*.ips' \) \
            -mmin -10 -exec cp {} . \; 2>/dev/null || true

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-startup-smoke-logs
          path: |
            smoke-build.log
            smoke-first-launch-console.log
            smoke-first-launch-retry-console.log
            smoke-console.log
            smoke-system.log
            smoke-screen-start.png
            smoke-screen-45s.png
            composer-*.log
            Hamster*.crash
            Hamster*.ips
          if-no-files-found: warn


