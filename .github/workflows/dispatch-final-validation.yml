name: CLAW Final Validation Dispatch

on:
  push:
    branches: [work/claw-voice-keyboard-bg]
    paths:
      - ".github/workflows/dispatch-final-validation.yml"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/claw-voice-keyboard-bg
          fetch-depth: 0

      - name: Remove one-shot dispatcher
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-final-validation.yml
          git commit -m "chore: remove final validation dispatcher"
          git push origin HEAD:work/claw-voice-keyboard-bg

      - name: Dispatch signed IPA and startup smoke on clean head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh workflow run build-ipa.yml --repo "$GITHUB_REPOSITORY" --ref work/claw-voice-keyboard-bg
          gh workflow run startup-smoke.yml --repo "$GITHUB_REPOSITORY" --ref work/claw-voice-keyboard-bg
          sleep 5
          echo "Signed IPA runs:"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build-ipa.yml --branch work/claw-voice-keyboard-bg --limit 3
          echo "Startup smoke runs:"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow startup-smoke.yml --branch work/claw-voice-keyboard-bg --limit 3
