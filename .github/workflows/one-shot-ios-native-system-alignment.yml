name: One-shot iOS native visual alignment

on:
  push:
    branches:
      - work/claw-voice-keyboard-bg
    paths:
      - .github/workflows/one-shot-ios-native-system-alignment.yml

permissions:
  contents: write
  actions: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: work/claw-voice-keyboard-bg
          fetch-depth: 0

      - name: Apply alignment patch
        run: python3 ci_scripts/one_shot_ios_native_alignment.py

      - name: Verify source patch
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'struct IOSNativeSystemMetrics' Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeSystemMetrics.swift
          grep -F 'weight: overlayFontWeight(for: entry.spec)' Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeKeyboardView.swift
          grep -F 'palette.toolbarControlSelected' Packages/HamsterKeyboardKit/Sources/View/KeyboardToolbarView.swift
          grep -F 'palette.candidateSelected' Packages/HamsterKeyboardKit/Sources/KeyboardKit/Appearance/StandardKeyboardAppearance.swift

      - name: Commit alignment and remove one-shot files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-ios-native-system-alignment.yml ci_scripts/one_shot_ios_native_alignment.py
          git add Packages/HamsterKeyboardKit/Sources/View/IOSNative \
                  Packages/HamsterKeyboardKit/Sources/View/CandidateBarView.swift \
                  Packages/HamsterKeyboardKit/Sources/View/KeyboardToolbarView.swift \
                  Packages/HamsterKeyboardKit/Sources/KeyboardKit/Appearance/StandardKeyboardAppearance.swift \
                  Packages/HamsterKeyboardKit/Tests/KeyboardKit/Appearance/IOSNativeSystemMetricsTest.swift
          git commit -m "feat: align iOS native keyboard visuals"
          git push origin HEAD:work/claw-voice-keyboard-bg

      - name: Dispatch signed IPA and startup smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-ipa.yml --ref work/claw-voice-keyboard-bg
          gh workflow run startup-smoke.yml --ref work/claw-voice-keyboard-bg
