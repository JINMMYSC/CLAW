name: Build & Sign GuruIM IPA

on:
  push:
    branches: [main, work/claw-voice-keyboard-bg, work/claw-productization-20261006]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Rime frameworks (zgl v0.1.0)
        run: |
          set -e
          mkdir -p Frameworks
          cd Frameworks
          BASE="https://github.com/zhanggenlove/LibrimeKit/releases/download/v0.1.0"
          for f in librime libleveldb libmarisa libopencc libyaml-cpp; do
            curl -fL -o "$f.xcframework.zip" "$BASE/$f.xcframework.zip"
            unzip -oq "$f.xcframework.zip"
            rm -f "$f.xcframework.zip"
          done
          ls -la

      - name: Build Rime schemas
        run: |
          set -e
          bash InputSchemaBuild.sh
          ls -la Resources/SharedSupport/

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Build device .app (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Hamster.xcodeproj \
            -scheme Hamster \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-dd \
            CODE_SIGNING_ALLOWED=NO | tee build-device.log
          ls -la build-dd/Build/Products/Release-iphoneos/

      - name: Package .ipa (unsigned)
        run: |
          set -e
          APP_PATH=$(find build-dd/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH"
          ls "$APP_PATH/PlugIns" 2>/dev/null || echo "!! no PlugIns dir"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry GuruIM-unsigned.ipa Payload/
          ls -lh GuruIM-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: guru-unsigned-ipa
          path: GuruIM-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guru-build-logs
          path: build-device.log

  sign:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/claw-voice-keyboard-bg' || github.ref == 'refs/heads/work/claw-productization-20261006'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: check
        env:
          P12_B64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MAIN_PROFILE_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          EXT_PROFILE_B64: ${{ secrets.PROFILE_EXT_B64 }}
          WIDGET_PROFILE_B64: ${{ secrets.PROFILE_WIDGET_B64 }}
        run: |
          set -e
          missing=()
          [ -n "$P12_B64" ] || missing+=(P12_BASE64)
          [ -n "$P12_PASSWORD" ] || missing+=(P12_PASSWORD)
          [ -n "$MAIN_PROFILE_B64" ] || missing+=(PROFILE_MAIN_B64)
          [ -n "$EXT_PROFILE_B64" ] || missing+=(PROFILE_EXT_B64)

          if find . -type f \( -name 'project.pbxproj' -o -name '*.plist' \) \
              -not -path './.git/*' -exec grep -l "com.apple.widgetkit-extension" {} + | grep -q .; then
            echo "has_widget=true" >> "$GITHUB_OUTPUT"
            [ -n "$WIDGET_PROFILE_B64" ] || missing+=(PROFILE_WIDGET_B64)
          else
            echo "has_widget=false" >> "$GITHUB_OUTPUT"
          fi

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required signing secrets: ${missing[*]}"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download unsigned ipa
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: guru-unsigned-ipa
          path: unsigned-art

      - name: Install signing assets
        if: steps.check.outputs.skip != 'true'
        env:
          P12_B64: ${{ secrets.P12_BASE64 }}
          MAIN_PROFILE_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          EXT_PROFILE_B64: ${{ secrets.PROFILE_EXT_B64 }}
          WIDGET_PROFILE_B64: ${{ secrets.PROFILE_WIDGET_B64 }}
        run: |
          set -e
          mkdir -p profiles
          echo "$P12_B64" | base64 --decode > sign.p12
          echo "$MAIN_PROFILE_B64" | base64 --decode > profiles/main.mobileprovision
          echo "$EXT_PROFILE_B64" | base64 --decode > profiles/ext.mobileprovision
          if [ "${{ steps.check.outputs.has_widget }}" = "true" ]; then
            echo "$WIDGET_PROFILE_B64" | base64 --decode > profiles/widget.mobileprovision
          fi

      - name: Sign ipa (app + keyboard extension)
        if: steps.check.outputs.skip != 'true'
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p build
          sign_args=(
            --ipa unsigned-art/GuruIM-unsigned.ipa
            --p12 sign.p12
            --password "$P12_PASSWORD"
            --main-profile profiles/main.mobileprovision
            --ext-profile profiles/ext.mobileprovision
            --out build/GuruIM-signed.ipa
          )
          if [ "${{ steps.check.outputs.has_widget }}" = "true" ]; then
            sign_args+=(--widget-profile profiles/widget.mobileprovision)
          fi
          python3 scripts/sign_ipa.py "${sign_args[@]}" | tee sign.log
          ls -lh build/GuruIM-signed.ipa

      - name: Verify signed ipa bundles and entitlements
        if: steps.check.outputs.skip != 'true'
        run: python3 scripts/verify_signed_ipa.py build/GuruIM-signed.ipa

      - name: Upload signed .ipa artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guru-signed-ipa
          path: build/GuruIM-signed.ipa
          if-no-files-found: error

      - name: Upload signing logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guru-signing-logs
          path: sign.log
          if-no-files-found: ignore
