name: Build & Sign GuruIM IPA

on:
  push:
    branches: [main, work/claw-voice-keyboard-bg, work/claw-productization-20261006, 'work/claw-ux-*', 'feature/claw-ipa-build-candidate-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      frozen_sha:
        description: 'Exact 40-character commit SHA approved for signed release'
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frozen release source SHA before build
        if: github.event_name == 'workflow_dispatch'
        env:
          FROZEN_SHA: ${{ inputs.frozen_sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_sha.py --frozen-sha "$FROZEN_SHA" --github-sha "$GITHUB_SHA"

      - name: Check signing prerequisites before build
        if: github.event_name == 'workflow_dispatch'
        env:
          P12_B64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MAIN_PROFILE_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          EXT_PROFILE_B64: ${{ secrets.PROFILE_EXT_B64 }}
          WIDGET_PROFILE_B64: ${{ secrets.PROFILE_WIDGET_B64 }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$P12_B64" ] || missing+=(P12_BASE64)
          [ -n "$P12_PASSWORD" ] || missing+=(P12_PASSWORD)
          [ -n "$MAIN_PROFILE_B64" ] || missing+=(PROFILE_MAIN_B64)
          [ -n "$EXT_PROFILE_B64" ] || missing+=(PROFILE_EXT_B64)
          [ -n "$WIDGET_PROFILE_B64" ] || missing+=(PROFILE_WIDGET_B64)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Validate installable Host/Keyboard/Widget profiles before expensive native build
        if: github.event_name == 'workflow_dispatch'
        env:
          MAIN_PROFILE_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          EXT_PROFILE_B64: ${{ secrets.PROFILE_EXT_B64 }}
          WIDGET_PROFILE_B64: ${{ secrets.PROFILE_WIDGET_B64 }}
          CLAW_TARGET_DEVICE_UDID: ${{ secrets.CLAW_TARGET_DEVICE_UDID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys
          import tempfile

          sys.path.insert(0, "scripts")
          from sign_ipa import validate_profile
          from verify_signed_ipa import (DEFAULT_ICLOUD_CONTAINER, extract_profile,
                                          validate_common_installable_devices)

          profiles = (
              ("MAIN_PROFILE_B64", "app.lgm.7517", (DEFAULT_ICLOUD_CONTAINER,)),
              ("EXT_PROFILE_B64", "app.lgm.7517.123", ()),
              ("WIDGET_PROFILE_B64", "app.lgm.7517.widget", ()),
          )
          decoded_profiles = []
          with tempfile.TemporaryDirectory() as tmp:
              for secret, bundle_id, icloud in profiles:
                  raw = base64.b64decode(os.environ.get(secret, ""), validate=True)
                  if not raw:
                      raise ValueError("empty provisioning profile for " + bundle_id)
                  path = pathlib.Path(tmp, bundle_id + ".mobileprovision")
                  path.write_bytes(raw)
                  profile = extract_profile(str(path))
                  entitlements = profile.get("Entitlements", {}) or {}
                  decoded_profiles.append((bundle_id, profile))
                  validate_profile(bundle_id, entitlements,
                                   required_icloud_containers=icloud)
                  print("Provisioning profile preflight OK:", bundle_id)
          validate_common_installable_devices(
              decoded_profiles,
              target_device_udid=os.environ.get("CLAW_TARGET_DEVICE_UDID") or None,
          )
          if os.environ.get("CLAW_TARGET_DEVICE_UDID"):
              print("Target iPhone authorization verified (identifier withheld)")
          else:
              print("Target iPhone not individually verified: optional device secret absent")
          print("Provisioning profiles share a developer team and compatible device scope")
          PY

      - name: Verify P12 certificate matches all three profiles before Xcode build
        if: github.event_name == 'workflow_dispatch'
        env:
          P12_B64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MAIN_PROFILE_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          EXT_PROFILE_B64: ${{ secrets.PROFILE_EXT_B64 }}
          WIDGET_PROFILE_B64: ${{ secrets.PROFILE_WIDGET_B64 }}
          CLAW_TARGET_DEVICE_UDID: ${{ secrets.CLAW_TARGET_DEVICE_UDID }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$P12_B64" | base64 -D > "$tmp/sign.p12"
          printf '%s' "$MAIN_PROFILE_B64" | base64 -D > "$tmp/main.mobileprovision"
          printf '%s' "$EXT_PROFILE_B64" | base64 -D > "$tmp/keyboard.mobileprovision"
          printf '%s' "$WIDGET_PROFILE_B64" | base64 -D > "$tmp/widget.mobileprovision"
          python3 scripts/sign_ipa.py \
            --preflight-signing-assets \
            --p12 "$tmp/sign.p12" \
            --password-env P12_PASSWORD \
            --main-profile "$tmp/main.mobileprovision" \
            --bundle-profile "app.lgm.7517.123=$tmp/keyboard.mobileprovision" \
            --bundle-profile "app.lgm.7517.widget=$tmp/widget.mobileprovision"

      - name: Download Rime frameworks (zgl v0.1.0)
        run: |
          set -euo pipefail
          mkdir -p Frameworks
          cd Frameworks
          BASE="https://github.com/zhanggenlove/LibrimeKit/releases/download/v0.1.0"
          for f in librime boost_atomic boost_filesystem boost_regex boost_system libleveldb libmarisa libopencc libyaml-cpp; do
            # The signed release must use the same pinned, verified assets
            # as the native Build Test workflow, not unchecked ZIP downloads.
            case "$f" in
              librime) sha="869ad448db92be5855e239f6f61a87d87e84974a4668509a3cbe4d766f294a54" ;;
              boost_atomic) sha="4db32b1015c0b2df5b55042e5ec2cced674f8e54e083f7d4aeb1e7db3a6c6925" ;;
              boost_filesystem) sha="d22bfd6aa9dd37333710aa5cea19fb065ab270bf2e55551841193bfac5b52af1" ;;
              boost_regex) sha="8b13fb6da177e777b76cc9e02d1aed342f922cb3c24f3029e3879f3c2f82fe33" ;;
              boost_system) sha="cb3a7cb48499686024923eef902c4327bb021eb8ef25da602a713b9108f56365" ;;
              libleveldb) sha="147cd30ee8763ccea573ca9778a5b2ed420c3adf5c91fe1b171fd1799422d103" ;;
              libmarisa) sha="cf66bb44fe11d5bc9ce39d61212e5f269bc4cc5045250bc79d62e34205bfc3bb" ;;
              libopencc) sha="715f2a323cc3f2b5aaeb3158533fc52ede265dbb54b07ea82f586c68604fe914" ;;
              libyaml-cpp) sha="4c277cc6fa3f7330200f16d4454cd77c43c495714465bcb0d506d07d5fcdcc4c" ;;
              *) echo "Unpinned RIME asset: $f" >&2; exit 1 ;;
            esac
            curl --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 120 -fL -o "$f.xcframework.zip" "$BASE/$f.xcframework.zip"
            printf '%s  %s\n' "$sha" "$f.xcframework.zip" | shasum -a 256 -c -
            unzip -oq "$f.xcframework.zip"
            rm -f "$f.xcframework.zip"
          done
          ls -la

      - name: Verify RIME iOS arm64 device slices before signed release
        run: |
          set -euo pipefail
          python3 scripts/verify_rime_device_slices.py --frameworks Frameworks

      - name: Build Rime schemas
        run: |
          set -e
          bash InputSchemaBuild.sh
          ls -la Resources/SharedSupport/

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Run P0 privacy regression suites before signed release
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run native HamsterKit XCTest before signed release
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime in data["devices"].values() for d in runtime if d["name"].startswith("iPhone")))')
          cd Packages/HamsterKit
          xcodebuild test \
            -scheme HamsterKit \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath /tmp/HamsterKitSignedReleaseTests

      - name: Run native HamsteriOS XCTest before signed release
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime in data["devices"].values() for d in runtime if d["name"].startswith("iPhone")))')
          cd Packages/HamsteriOS
          xcodebuild test \
            -scheme HamsteriOS \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -skip-testing:HamsteriOSTests/CloudKitHelperTest \
            -derivedDataPath /tmp/HamsteriOSSignedReleaseTests

      - name: Build device .app (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Hamster.xcodeproj \
            -scheme Hamster \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-dd \
            CODE_SIGNING_ALLOWED=NO | tee build-device.log
          ls -la build-dd/Build/Products/Release-iphoneos/

      - name: Stamp exact source SHA in Host and extensions
        run: |
          set -euo pipefail
          APP_PATH=$(find build-dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP_PATH"
          for plist in "$APP_PATH/Info.plist" "$APP_PATH"/PlugIns/*.appex/Info.plist; do
            [ -f "$plist" ] || continue
            /usr/libexec/PlistBuddy -c "Delete :ClawSourceCommit" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :ClawSourceCommit string $GITHUB_SHA" "$plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :ClawSourceCommit' "$plist")" = "$GITHUB_SHA"
          done

      - name: Package .ipa (unsigned)
        run: |
          set -e
          APP_PATH=$(find build-dd/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH"
          ls "$APP_PATH/PlugIns" 2>/dev/null || echo "!! no PlugIns dir"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry GuruIM-unsigned.ipa Payload/
          ls -lh GuruIM-unsigned.ipa

      - name: Verify and collect same-build dSYM symbols
        run: |
          set -euo pipefail
          PRODUCTS=build-dd/Build/Products/Release-iphoneos
          mkdir -p build-debug-symbols
          APP_PATH=$(find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP_PATH"
          for bundle in "$APP_PATH" "$APP_PATH"/PlugIns/*.appex; do
            [ -d "$bundle" ] || continue
            name=$(basename "$bundle")
            dsym="$PRODUCTS/$name.dSYM"
            test -d "$dsym" || { echo "::error::Missing dSYM for $name"; exit 1; }
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Info.plist")
            binary="$bundle/$executable"
            test -f "$binary"
            binary_uuids=$(xcrun dwarfdump --uuid "$binary" | sed -E 's/.*UUID: ([0-9A-Fa-f-]+).*/\1/' | sort)
            dsym_uuids=$(xcrun dwarfdump --uuid "$dsym" | sed -E 's/.*UUID: ([0-9A-Fa-f-]+).*/\1/' | sort)
            test -n "$binary_uuids" && test "$binary_uuids" = "$dsym_uuids" || {
              echo "::error::dSYM UUID mismatch for $name"; exit 1;
            }
            cp -R "$dsym" build-debug-symbols/
            echo "Verified matching dSYM UUID for $name"
          done
          echo "$GITHUB_SHA" > build-debug-symbols/SOURCE_SHA.txt

      - name: Upload matching-build dSYM symbols
        uses: actions/upload-artifact@v4
        with:
          name: claw-matching-dsym
          path: build-debug-symbols/
          if-no-files-found: error
          retention-days: 30

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: guru-unsigned-ipa
          path: GuruIM-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guru-build-logs
          path: build-device.log

  sign:
    needs: build
    # Pushes and PRs may test/build, but cannot sign an unapproved commit.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frozen release source SHA
        env:
          FROZEN_SHA: ${{ inputs.frozen_sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_sha.py --frozen-sha "$FROZEN_SHA" --github-sha "$GITHUB_SHA"

      - name: Check signing secrets
        id: check
        env:
          P12_B64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MAIN_PROFILE_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          EXT_PROFILE_B64: ${{ secrets.PROFILE_EXT_B64 }}
          WIDGET_PROFILE_B64: ${{ secrets.PROFILE_WIDGET_B64 }}
        run: |
          set -e
          missing=()
          [ -n "$P12_B64" ] || missing+=(P12_BASE64)
          [ -n "$P12_PASSWORD" ] || missing+=(P12_PASSWORD)
          [ -n "$MAIN_PROFILE_B64" ] || missing+=(PROFILE_MAIN_B64)
          [ -n "$EXT_PROFILE_B64" ] || missing+=(PROFILE_EXT_B64)
          [ -n "$WIDGET_PROFILE_B64" ] || missing+=(PROFILE_WIDGET_B64)

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required signing secrets: ${missing[*]}"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download unsigned ipa
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: guru-unsigned-ipa
          path: unsigned-art

      - name: Verify unsigned IPA matches frozen SHA before signing
        run: |
          set -euo pipefail
          python3 scripts/verify_signed_ipa.py \
            unsigned-art/GuruIM-unsigned.ipa \
            --check-unsigned-source-sha "$GITHUB_SHA"

      - name: Inspect extension bundle identifiers
        id: extensions
        env:
          WIDGET_PROFILE_B64: ${{ secrets.PROFILE_WIDGET_B64 }}
          WIDGET_BUNDLE_ID: app.lgm.7517.widget
        run: |
          set -euo pipefail
          extension_ids=$(python3 scripts/sign_ipa.py \
            --ipa unsigned-art/GuruIM-unsigned.ipa \
            --list-extension-bundle-identifiers)
          printf '%s\n' "$extension_ids"

          keyboard_found=false
          has_widget=false
          while IFS= read -r bundle_id; do
            [ -n "$bundle_id" ] || continue
            case "$bundle_id" in
              app.lgm.7517.123) keyboard_found=true ;;
              "$WIDGET_BUNDLE_ID") has_widget=true ;;
              *)
                echo "::error::No signing-profile mapping is configured for extension $bundle_id"
                exit 1
                ;;
            esac
          done <<< "$extension_ids"

          if [ "$keyboard_found" != "true" ]; then
            echo "::error::Expected keyboard extension app.lgm.7517.123 is missing from the IPA"
            exit 1
          fi
          if [ "$has_widget" != "true" ]; then
            echo "::error::Widget extension app.lgm.7517.widget is missing from the IPA"
            exit 1
          fi
          if [ "$has_widget" = "true" ] && [ -z "$WIDGET_PROFILE_B64" ]; then
            echo "::error::Widget remained in the IPA without PROFILE_WIDGET_B64"
            exit 1
          fi
          echo "has_widget=$has_widget" >> "$GITHUB_OUTPUT"

      - name: Install signing assets
        if: steps.check.outputs.skip != 'true'
        env:
          P12_B64: ${{ secrets.P12_BASE64 }}
          MAIN_PROFILE_B64: ${{ secrets.PROFILE_MAIN_B64 }}
          EXT_PROFILE_B64: ${{ secrets.PROFILE_EXT_B64 }}
          WIDGET_PROFILE_B64: ${{ secrets.PROFILE_WIDGET_B64 }}
        run: |
          set -e
          mkdir -p profiles
          printf '%s' "$P12_B64" | base64 -D > sign.p12
          printf '%s' "$MAIN_PROFILE_B64" | base64 -D > profiles/main.mobileprovision
          printf '%s' "$EXT_PROFILE_B64" | base64 -D > profiles/ext.mobileprovision
          if [ "${{ steps.extensions.outputs.has_widget }}" = "true" ]; then
            printf '%s' "$WIDGET_PROFILE_B64" | base64 -D > profiles/widget.mobileprovision
          fi

      - name: Sign ipa (app + keyboard extension)
        if: steps.check.outputs.skip != 'true'
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          CLAW_TARGET_DEVICE_UDID: ${{ secrets.CLAW_TARGET_DEVICE_UDID }}
        run: |
          set -o pipefail
          mkdir -p build
          sign_args=(
            --ipa unsigned-art/GuruIM-unsigned.ipa
            --p12 sign.p12
            --password-env P12_PASSWORD
            --main-profile profiles/main.mobileprovision
            --bundle-profile app.lgm.7517.123=profiles/ext.mobileprovision
            --out build/GuruIM-signed.ipa
          )
          if [ "${{ steps.extensions.outputs.has_widget }}" = "true" ]; then
            WIDGET_BUNDLE_ID=app.lgm.7517.widget
            sign_args+=(--bundle-profile "$WIDGET_BUNDLE_ID=profiles/widget.mobileprovision")
          fi
          python3 scripts/sign_ipa.py "${sign_args[@]}" | tee sign.log
          ls -lh build/GuruIM-signed.ipa

      - name: Verify signed ipa bundles and entitlements
        if: steps.check.outputs.skip != 'true'
        run: python3 scripts/verify_signed_ipa.py build/GuruIM-signed.ipa

      - name: Verify embedded source SHA matches signed IPA run
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import os, plistlib, zipfile
          expected = os.environ["GITHUB_SHA"]
          with zipfile.ZipFile("build/GuruIM-signed.ipa") as z:
              paths = [n for n in z.namelist() if n.endswith("/Info.plist") and
                       (n.count("/") == 2 or "/PlugIns/" in n and n.count("/") == 4)]
              assert paths, "no signed app Info.plist"
              for name in paths:
                  actual = plistlib.loads(z.read(name)).get("ClawSourceCommit")
                  assert actual == expected, f"{name}: missing or mismatched source SHA"
              print(f"Verified {len(paths)} signed bundles against {expected}")
          PY

      - name: Upload signed .ipa artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guru-signed-ipa
          path: build/GuruIM-signed.ipa
          if-no-files-found: error

      - name: Upload signing logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guru-signing-logs
          path: sign.log
          if-no-files-found: ignore

