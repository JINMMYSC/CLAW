name: CLAW voice keyboard bg one-shot

on:
  push:
    branches:
      - work/claw-voice-keyboard-bg

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: work/claw-voice-keyboard-bg
          fetch-depth: 0

      - name: Apply CLAW voice and keyboard background fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, got {count}")
              p.write_text(text.replace(old, new, 1))

          appearance = "Packages/HamsterKeyboardKit/Sources/KeyboardKit/Appearance/StandardKeyboardAppearance.swift"
          replace_once(
              appearance,
              "    style.backgroundColor = UIColor.white.withAlphaComponent(0.001)",
              "    style.backgroundColor = ClawPanelPalette.keyboardBackground",
          )

          controller = "Packages/HamsterKeyboardKit/Sources/Controller/KeyboardInputViewController.swift"
          replace_once(
              controller,
              "    setupCombineRIMEInput()\n\n    // ClawTalk: 面板输入桥接",
              "    setupCombineRIMEInput()\n    syncKeyboardBackgroundColor()\n\n    // ClawTalk: 面板输入桥接",
          )
          replace_once(
              controller,
              "  open func viewWillSyncWithContext() {\n    keyboardContext.sync(with: self)\n    keyboardTextContext.sync(with: self)\n  }",
              "  open func viewWillSyncWithContext() {\n    keyboardContext.sync(with: self)\n    keyboardTextContext.sync(with: self)\n    syncKeyboardBackgroundColor()\n  }",
          )
          replace_once(
              controller,
              "  open func selectNextKeyboard() {\n    // advanceToNextInputMode()\n  }",
              "  open func selectNextKeyboard() {\n    advanceToNextInputMode()\n  }",
          )
          replace_once(
              controller,
              "private extension KeyboardInputViewController {\n  /// 刷新属性",
              "private extension KeyboardInputViewController {\n  /// 同步系统 input view / safe area 与当前键盘主题背景，避免底部透出系统颜色。\n  func syncKeyboardBackgroundColor() {\n    let backgroundColor = keyboardAppearance.backgroundStyle.backgroundColor\n    view.backgroundColor = backgroundColor\n    inputView?.backgroundColor = backgroundColor\n  }\n\n  /// 刷新属性",
          )

          voice = Path("Packages/HamsterKeyboardKit/Sources/View/ClawPanel/ClawVoiceInputService.swift")
          voice.write_text(r'''import AVFoundation
          import Foundation
          import Speech

          /// 语音输入服务：按住说话 → SFSpeechRecognizer（zh-Hans）转文字
          public final class ClawVoiceInputService: NSObject {
            public static let shared = ClawVoiceInputService()

            private let recognizer = SFSpeechRecognizer(locale: Locale(identifier: "zh-Hans"))
            private var audioEngine: AVAudioEngine?
            private var recognitionRequest: SFSpeechAudioBufferRecognitionRequest?
            private var recognitionTask: SFSpeechRecognitionTask?
            private var sessionGeneration: UInt = 0

            /// 是否正在录音
            public private(set) var isRecording = false

            private var streamingPartial: ((String) -> Void)?
            private var streamingSegment: ((String) -> Void)?
            private var streamingError: ((Error) -> Void)?
            private var silenceWorkItem: DispatchWorkItem?
            private var pendingCleanupWorkItem: DispatchWorkItem?

            private override init() {
              super.init()
            }

            /// 语音权限状态（只读，不在键盘扩展里弹系统权限框，避免闪退）
            public enum ClawVoiceAuth {
              case authorized
              case denied
              case undetermined
            }

            public var authorizationStatus: ClawVoiceAuth {
              let speech = SFSpeechRecognizer.authorizationStatus()
              let mic = AVAudioSession.sharedInstance().recordPermission
              if speech == .authorized, mic == .granted { return .authorized }
              if speech == .denied || speech == .restricted || mic == .denied {
                return .denied
              }
              return .undetermined
            }

            private var isKeyboardExtensionRuntime: Bool {
              Bundle.main.bundleURL.pathExtension.lowercased() == "appex"
            }

            /// 开始录音；停止后通过 completion 返回最终识别文本
            public func start(completion: @escaping (Result<String, Error>) -> Void) {
              guard !isKeyboardExtensionRuntime else {
                completion(.failure(ClawVoiceError.keyboardExtensionUnsupported))
                return
              }

              let generation = resetForNewSession()
              guard let recognizer, recognizer.isAvailable else {
                completion(.failure(ClawVoiceError.recognizerUnavailable))
                return
              }

              let audioEngine = AVAudioEngine()
              let request = SFSpeechAudioBufferRecognitionRequest()
              request.shouldReportPartialResults = false
              request.requiresOnDeviceRecognition = false

              let inputNode = audioEngine.inputNode
              let format = inputNode.outputFormat(forBus: 0)
              guard format.sampleRate > 0 else {
                completion(.failure(ClawVoiceError.audioUnavailable))
                return
              }

              self.audioEngine = audioEngine
              self.recognitionRequest = request
              inputNode.installTap(onBus: 0, bufferSize: 1024, format: format) { buffer, _ in
                request.append(buffer)
              }

              recognitionTask = recognizer.recognitionTask(with: request) { [weak self] result, error in
                guard let self, self.sessionGeneration == generation else { return }
                if let result, result.isFinal {
                  let text = result.bestTranscription.formattedString
                  self.finishSession(generation, cancelTask: false, clearStreamingCallbacks: true)
                  completion(.success(text))
                } else if let error {
                  self.finishSession(generation, cancelTask: false, clearStreamingCallbacks: true)
                  completion(.failure(error))
                }
              }

              do {
                let session = AVAudioSession.sharedInstance()
                try session.setCategory(.record, mode: .measurement, options: [])
                try session.setActive(true, options: .notifyOthersOnDeactivation)
                audioEngine.prepare()
                try audioEngine.start()
                isRecording = true
              } catch {
                finishSession(generation, cancelTask: true, clearStreamingCallbacks: true)
                completion(.failure(error))
              }
            }

            /// 流式听写（实时通话模式）：持续收音，静音停顿自动断句
            /// - onPartial: 实时转写中间结果（输入框预览）
            /// - onSegment: 每段完整识别（静音停顿后触发），触发后本服务自动停止，由调用方决定是否续听
            /// - onError: 识别失败
            public func startStreaming(
              onPartial: @escaping (String) -> Void,
              onSegment: @escaping (String) -> Void,
              onError: @escaping (Error) -> Void
            ) {
              guard !isKeyboardExtensionRuntime else {
                onError(ClawVoiceError.keyboardExtensionUnsupported)
                return
              }

              let generation = resetForNewSession()
              streamingPartial = onPartial
              streamingSegment = onSegment
              streamingError = onError

              guard let recognizer, recognizer.isAvailable else {
                clearStreamingCallbacks()
                onError(ClawVoiceError.recognizerUnavailable)
                return
              }

              let audioEngine = AVAudioEngine()
              let request = SFSpeechAudioBufferRecognitionRequest()
              request.shouldReportPartialResults = true
              request.requiresOnDeviceRecognition = false

              let inputNode = audioEngine.inputNode
              let format = inputNode.outputFormat(forBus: 0)
              guard format.sampleRate > 0 else {
                clearStreamingCallbacks()
                onError(ClawVoiceError.audioUnavailable)
                return
              }

              self.audioEngine = audioEngine
              self.recognitionRequest = request
              inputNode.installTap(onBus: 0, bufferSize: 1024, format: format) { buffer, _ in
                request.append(buffer)
              }

              recognitionTask = recognizer.recognitionTask(with: request) { [weak self] result, error in
                guard let self, self.sessionGeneration == generation else { return }
                if let result {
                  let text = result.bestTranscription.formattedString
                  if result.isFinal {
                    let onSegment = self.streamingSegment
                    self.finishSession(generation, cancelTask: false, clearStreamingCallbacks: true)
                    onSegment?(text)
                  } else {
                    self.restartSilenceTimer(for: generation)
                    self.streamingPartial?(text)
                  }
                } else if let error {
                  let onError = self.streamingError
                  self.finishSession(generation, cancelTask: false, clearStreamingCallbacks: true)
                  onError?(error)
                }
              }

              do {
                let session = AVAudioSession.sharedInstance()
                try session.setCategory(.record, mode: .measurement, options: [])
                try session.setActive(true, options: .notifyOthersOnDeactivation)
                audioEngine.prepare()
                try audioEngine.start()
                isRecording = true
              } catch {
                let callback = streamingError
                finishSession(generation, cancelTask: true, clearStreamingCallbacks: true)
                callback?(error)
              }
            }

            /// 静音停顿 1.2s 判定断句：结束当前段，等待 final 结果
            private func restartSilenceTimer(for generation: UInt) {
              silenceWorkItem?.cancel()
              let item = DispatchWorkItem { [weak self] in
                guard let self,
                      self.sessionGeneration == generation,
                      self.isRecording else { return }
                self.stop()
              }
              silenceWorkItem = item
              DispatchQueue.main.asyncAfter(deadline: .now() + 1.2, execute: item)
            }

            private func clearStreamingCallbacks() {
              streamingPartial = nil
              streamingSegment = nil
              streamingError = nil
            }

            /// 停止采集并 endAudio，但保留 recognition task/callback，给 Speech final result 收尾机会。
            public func stop() {
              silenceWorkItem?.cancel()
              silenceWorkItem = nil
              pendingCleanupWorkItem?.cancel()
              pendingCleanupWorkItem = nil

              guard recognitionRequest != nil || recognitionTask != nil || audioEngine != nil else {
                isRecording = false
                clearStreamingCallbacks()
                return
              }

              let generation = sessionGeneration
              recognitionRequest?.endAudio()
              if let audioEngine {
                audioEngine.stop()
                audioEngine.inputNode.removeTap(onBus: 0)
              }
              audioEngine = nil
              isRecording = false
              try? AVAudioSession.sharedInstance().setActive(false, options: .notifyOthersOnDeactivation)

              // 正常情况下 Speech 会很快返回 final；兜底避免无 final 时 task/callback 长期滞留。
              let cleanup = DispatchWorkItem { [weak self] in
                guard let self, self.sessionGeneration == generation else { return }
                self.finishSession(generation, cancelTask: true, clearStreamingCallbacks: true)
              }
              pendingCleanupWorkItem = cleanup
              DispatchQueue.main.asyncAfter(deadline: .now() + 2.0, execute: cleanup)
            }

            /// 新会话开始前强制取消上一会话；generation 让上一 task 的迟到 callback 自动失效。
            @discardableResult
            private func resetForNewSession() -> UInt {
              sessionGeneration &+= 1
              teardown(cancelTask: true, clearStreamingCallbacks: true)
              return sessionGeneration
            }

            private func finishSession(
              _ generation: UInt,
              cancelTask: Bool,
              clearStreamingCallbacks: Bool
            ) {
              guard sessionGeneration == generation else { return }
              sessionGeneration &+= 1
              teardown(cancelTask: cancelTask, clearStreamingCallbacks: clearStreamingCallbacks)
            }

            private func teardown(cancelTask: Bool, clearStreamingCallbacks: Bool) {
              silenceWorkItem?.cancel()
              silenceWorkItem = nil
              pendingCleanupWorkItem?.cancel()
              pendingCleanupWorkItem = nil

              recognitionRequest?.endAudio()
              if let audioEngine {
                audioEngine.stop()
                audioEngine.inputNode.removeTap(onBus: 0)
              }
              if cancelTask {
                recognitionTask?.cancel()
              }

              audioEngine = nil
              recognitionRequest = nil
              recognitionTask = nil
              isRecording = false
              if clearStreamingCallbacks {
                self.clearStreamingCallbacks()
              }
              try? AVAudioSession.sharedInstance().setActive(false, options: .notifyOthersOnDeactivation)
            }
          }

          public enum ClawVoiceError: LocalizedError {
            case recognizerUnavailable
            case audioUnavailable
            case keyboardExtensionUnsupported
            case unknown

            public var errorDescription: String? {
              switch self {
              case .recognizerUnavailable: return "语音识别不可用，请检查系统设置"
              case .audioUnavailable: return "麦克风不可用"
              case .keyboardExtensionUnsupported: return "键盘扩展无法直接使用麦克风，请切换到系统键盘使用听写"
              case .unknown: return "语音识别失败"
              }
            }
          }
          '''.replace("\n          ", "\n").lstrip())

          overlay = "Packages/HamsterKeyboardKit/Sources/View/ClawPanel/ClawPanelOverlayView.swift"
          replace_once(
              overlay,
              "    micButton.layer.cornerRadius = 18\n    let micLongPress = UILongPressGestureRecognizer(target: self, action: #selector(micLongPressed(_:)))",
              "    micButton.layer.cornerRadius = 18\n    micButton.addTarget(self, action: #selector(micTapped), for: .touchUpInside)\n    let micLongPress = UILongPressGestureRecognizer(target: self, action: #selector(micLongPressed(_:)))",
          )
          replace_once(
              overlay,
              "  @objc private func micLongPressed(_ sender: UILongPressGestureRecognizer) {",
              '''  private var isKeyboardExtensionRuntime: Bool {
            Bundle.main.bundleURL.pathExtension.lowercased() == "appex"
          }

          /// 自定义键盘扩展不能可靠直接占用麦克风；切到系统输入法，让用户使用系统听写。
          private func fallbackToSystemDictation() {
            isMicHeld = false
            isListening = false
            ClawVoiceInputService.shared.stop()
            updateMicUI(recording: false)
            if let controller = clawParentViewController as? KeyboardInputViewController {
              controller.selectNextKeyboard()
              return
            }
            showResultMessage("键盘扩展无法直接使用麦克风，请切换到系统键盘后使用听写")
          }

          @objc private func micTapped() {
            guard !isCallActive else { return }
            if isKeyboardExtensionRuntime {
              fallbackToSystemDictation()
              return
            }
            if isListening {
              isMicHeld = false
              ClawVoiceInputService.shared.stop()
              isListening = false
              updateMicUI(recording: false)
            } else {
              isMicHeld = true
              startVoiceInput()
            }
          }

          @objc private func micLongPressed(_ sender: UILongPressGestureRecognizer) {'''.replace("\n          ", "\n"),
          )
          replace_once(
              overlay,
              "  private func startVoiceInput() {\n    switch ClawVoiceInputService.shared.authorizationStatus {",
              "  private func startVoiceInput() {\n    if isKeyboardExtensionRuntime {\n      fallbackToSystemDictation()\n      return\n    }\n    switch ClawVoiceInputService.shared.authorizationStatus {",
          )
          replace_once(
              overlay,
              "    case .denied:\n      showResultMessage(\"麦克风/语音识别权限未开启，请到 ClawTalk 主程序或系统设置中开启\")\n      return\n    case .undetermined:\n      showResultMessage(\"请先在 ClawTalk 主程序中授权麦克风与语音识别\")\n      return",
              "    case .denied:\n      isMicHeld = false\n      showResultMessage(\"麦克风/语音识别权限未开启，请到 ClawTalk 主程序或系统设置中开启\")\n      return\n    case .undetermined:\n      isMicHeld = false\n      showResultMessage(\"请先在 ClawTalk 主程序中授权麦克风与语音识别\")\n      return",
          )
          replace_once(
              overlay,
              "        guard let self else { return }\n        self.isListening = false\n        self.updateMicUI(recording: false)",
              "        guard let self else { return }\n        self.isMicHeld = false\n        self.isListening = false\n        self.updateMicUI(recording: false)",
          )
          replace_once(
              overlay,
              "  private func startCall() {\n    guard !isCallActive else { return }\n    switch ClawVoiceInputService.shared.authorizationStatus {",
              "  private func startCall() {\n    guard !isCallActive else { return }\n    if isKeyboardExtensionRuntime {\n      fallbackToSystemDictation()\n      return\n    }\n    switch ClawVoiceInputService.shared.authorizationStatus {",
          )

          test = "Packages/HamsterKeyboardKit/Tests/KeyboardKit/Appearance/StanderKeyboardAppearanceTest.swift"
          replace_once(
              test,
              "  func testPerformanceExample() throws {",
              '''  func testDefaultBackgroundStyleIsOpaque() throws {
            let appearance = StandardKeyboardAppearance(keyboardContext: .preview)
            XCTAssertEqual(appearance.backgroundStyle.backgroundColor.cgColor.alpha, 1, accuracy: 0.001)
          }

          func testPerformanceExample() throws {'''.replace("\n          ", "\n"),
          )
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "5"
          grep -Fq 'style.backgroundColor = ClawPanelPalette.keyboardBackground' Packages/HamsterKeyboardKit/Sources/KeyboardKit/Appearance/StandardKeyboardAppearance.swift
          grep -Fq 'advanceToNextInputMode()' Packages/HamsterKeyboardKit/Sources/Controller/KeyboardInputViewController.swift
          grep -Fq 'inputView?.backgroundColor = backgroundColor' Packages/HamsterKeyboardKit/Sources/Controller/KeyboardInputViewController.swift
          grep -Fq 'case keyboardExtensionUnsupported' Packages/HamsterKeyboardKit/Sources/View/ClawPanel/ClawVoiceInputService.swift
          grep -Fq 'micButton.addTarget(self, action: #selector(micTapped)' Packages/HamsterKeyboardKit/Sources/View/ClawPanel/ClawPanelOverlayView.swift
          grep -Fq 'XCTAssertEqual(appearance.backgroundStyle.backgroundColor.cgColor.alpha, 1' Packages/HamsterKeyboardKit/Tests/KeyboardKit/Appearance/StanderKeyboardAppearanceTest.swift
          git diff --stat

      - name: Commit and push source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/claw-voice-keyboard-bg-once.yml
          git add Packages/HamsterKeyboardKit/Sources/KeyboardKit/Appearance/StandardKeyboardAppearance.swift
          git add Packages/HamsterKeyboardKit/Sources/Controller/KeyboardInputViewController.swift
          git add Packages/HamsterKeyboardKit/Sources/View/ClawPanel/ClawVoiceInputService.swift
          git add Packages/HamsterKeyboardKit/Sources/View/ClawPanel/ClawPanelOverlayView.swift
          git add Packages/HamsterKeyboardKit/Tests/KeyboardKit/Appearance/StanderKeyboardAppearanceTest.swift
          git commit -m "fix: repair voice fallback and keyboard background"
          git push origin HEAD:work/claw-voice-keyboard-bg

      - name: Dispatch IPA and startup smoke
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/build-ipa.yml/dispatches" -f ref='work/claw-voice-keyboard-bg'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/startup-smoke.yml/dispatches" -f ref='work/claw-voice-keyboard-bg'
