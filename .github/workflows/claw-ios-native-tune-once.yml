name: CLAW iOS Native Tune Once

on:
  push:
    branches:
      - work/claw-voice-keyboard-bg
    paths:
      - .github/workflows/claw-ios-native-tune-once.yml

permissions:
  contents: write
  actions: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/claw-voice-keyboard-bg
          fetch-depth: 0

      - name: Apply iOS native keyboard visual tuning
        run: python3 .github/scripts/tune_ios_native_once.py

      - name: Validate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'keyShadowOpacity: Float = 0.32' Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeLayout.swift
          grep -q 'return 22' Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeKeyboardView.swift
          grep -q 'refreshKeyShadows()' Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeKeyboardView.swift
          grep -q 'keyShadow = iosRGB(0x868B93)' Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativePalette.swift
          grep -q 'IOSNativePalette.current' Packages/HamsterKeyboardKit/Sources/View/KeyboardRootView.swift
          grep -q 'IOSNativePalette.current' Packages/HamsterKeyboardKit/Sources/Controller/KeyboardInputViewController.swift

      - name: Commit source changes and remove one-shot files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/claw-ios-native-tune-once.yml .github/scripts/tune_ios_native_once.py
          git add Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeLayout.swift \
                  Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativePalette.swift \
                  Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeKeyboardView.swift \
                  Packages/HamsterKeyboardKit/Sources/View/KeyboardRootView.swift \
                  Packages/HamsterKeyboardKit/Sources/Controller/KeyboardInputViewController.swift
          git diff --cached --check
          git commit -m "fix: match iOS native keyboard appearance"
          git push origin HEAD:work/claw-voice-keyboard-bg

      - name: Dispatch signed IPA and startup smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST repos/${{ github.repository }}/actions/workflows/build-ipa.yml/dispatches -f ref=work/claw-voice-keyboard-bg
          gh api -X POST repos/${{ github.repository }}/actions/workflows/startup-smoke.yml/dispatches -f ref=work/claw-voice-keyboard-bg
