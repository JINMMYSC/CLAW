name: CLAW iOS Native Tune Once

on:
  push:
    branches:
      - work/claw-voice-keyboard-bg
    paths:
      - .github/workflows/claw-ios-native-tune-once.yml

permissions:
  contents: write
  actions: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/claw-voice-keyboard-bg
          fetch-depth: 0

      - name: Apply iOS native keyboard visual tuning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          layout = "Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeLayout.swift"
          replace_once(layout, '''public enum IOSNativeDesign {
  public static let width: CGFloat = 375
  public static let paddingH: CGFloat = 3.5
  public static let paddingV: CGFloat = 4
  public static let gapH: CGFloat = 5.5
  public static let radius: CGFloat = 6

  public static func rowH(for panel: IOSNativePanel) -> CGFloat {
    panel.geometry == .nineGrid ? 50 : 46
  }

  public static func gapV(for panel: IOSNativePanel) -> CGFloat {
    panel.geometry == .nineGrid ? 6 : 10
  }

  public static func height(for panel: IOSNativePanel) -> CGFloat {
    paddingV + 3 * (rowH(for: panel) + gapV(for: panel)) + rowH(for: panel)
  }
}''', '''public enum IOSNativeDesign {
  /// Apple iPhone keyboard reference canvas. Horizontal values scale with the real input-view width.
  public static let width: CGFloat = 375
  /// Stock iOS keeps the outer edge tight and uses a near-6pt gutter between key caps.
  public static let paddingH: CGFloat = 3
  public static let paddingV: CGFloat = 6
  public static let gapH: CGFloat = 6
  public static let radius: CGFloat = 5.5

  /// Subtle one-point key shadow used by the system keyboard to separate caps from the board.
  public static let keyShadowOffsetY: CGFloat = 1
  public static let keyShadowOpacity: Float = 0.32
  public static let keyShadowRadius: CGFloat = 0

  public static func rowH(for panel: IOSNativePanel) -> CGFloat {
    panel.geometry == .nineGrid ? 48 : 42
  }

  public static func gapV(for panel: IOSNativePanel) -> CGFloat {
    panel.geometry == .nineGrid ? 7 : 11
  }

  public static func height(for panel: IOSNativePanel) -> CGFloat {
    paddingV + 3 * (rowH(for: panel) + gapV(for: panel)) + rowH(for: panel) + paddingV
  }
}''')

          palette = "Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativePalette.swift"
          replace_once(palette, '''  let separator: UIColor

  init(dark: Bool) {
    if dark {
      board = iosRGB(0x1C1C1E)
      char = iosRGB(0x636366)
      charPressed = iosRGB(0x48484A)
      funcGray = iosRGB(0x3A3A3C)
      lightGray = iosRGB(0x48484A)
      sendBlue = iosRGB(0x0A84FF)
      textDark = UIColor.white
      textWhite = UIColor.white
      separator = iosRGB(0x48484A)
    } else {
      board = iosRGB(0xD1D4D9)
      char = UIColor.white
      charPressed = iosRGB(0xE8ECF0)
      funcGray = iosRGB(0xAAB0BA)
      lightGray = iosRGB(0xE8ECF0)
      sendBlue = iosRGB(0x007AFF)
      textDark = UIColor.black
      textWhite = UIColor.white
      separator = iosRGB(0xC7C7CC)
    }
  }''', '''  let separator: UIColor
  let keyShadow: UIColor

  init(dark: Bool) {
    if dark {
      board = iosRGB(0x1C1C1E)
      char = iosRGB(0x636366)
      charPressed = iosRGB(0x4A4A4D)
      funcGray = iosRGB(0x3A3A3C)
      lightGray = iosRGB(0x48484A)
      sendBlue = iosRGB(0x0A84FF)
      textDark = UIColor.white
      textWhite = UIColor.white
      separator = iosRGB(0x48484A)
      keyShadow = UIColor.black
    } else {
      board = iosRGB(0xD1D3D9)
      char = UIColor.white
      charPressed = iosRGB(0xB8BDC6)
      funcGray = iosRGB(0xADB3BC)
      lightGray = iosRGB(0xE2E5E9)
      sendBlue = iosRGB(0x007AFF)
      textDark = UIColor.black
      textWhite = UIColor.white
      separator = iosRGB(0xC7C7CC)
      keyShadow = iosRGB(0x868B93)
    }
  }''')

          view = "Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeKeyboardView.swift"
          replace_once(view, '''  override func updateButtonStyle(isPressed: Bool) {
    super.updateButtonStyle(isPressed: isPressed)
    if let label = overlayLabel {''', '''  override func updateButtonStyle(isPressed: Bool) {
    super.updateButtonStyle(isPressed: isPressed)
    layer.shadowOpacity = isPressed ? 0.10 : IOSNativeDesign.keyShadowOpacity
    if let label = overlayLabel {''')

          replace_once(view, '''  override public func setupAppearance() {
    backgroundColor = palette.board
    contentMode = .redraw
  }

  /// 高度按当前面板纵向几何（9键族 4+3*(50+6)+50=222；紧凑族 4+3*(46+10)+46=218）''', '''  override public func setupAppearance() {
    backgroundColor = palette.board
    contentMode = .redraw
    refreshKeyShadows()
  }

  /// 高度按当前面板纵向几何，并保留与系统键盘一致的上下留白。''')

          replace_once(view, '''    // 修复 P 图圆角：底色层显式设置圆角（appearance.style 未配时默认直角）
    for entry in entries {
      entry.button.buttonContentView.layer.cornerRadius = IOSNativeDesign.radius
      entry.button.buttonContentView.layer.masksToBounds = true
    }
    refreshOverlays()''', '''    // iOS 键帽：固定圆角 + 1pt 底部阴影，避免第三方主题覆盖原生模式的层次感。
    for entry in entries {
      entry.button.buttonContentView.layer.cornerRadius = IOSNativeDesign.radius
      entry.button.buttonContentView.layer.masksToBounds = true
      entry.button.layer.cornerRadius = IOSNativeDesign.radius
      entry.button.layer.masksToBounds = false
    }
    refreshKeyShadows()
    refreshOverlays()''')

          replace_once(view, '''  private func overlayFontSize(for spec: IOSNativeKey) -> CGFloat {
    if spec.isSend { return 14 }
    if spec.action == .primary(.return) { return 14 }
    let text = spec.displayText ?? ""
    switch text {
    case "⌫": return 16
    case "空格", "space": return 13
    case "😀": return 20
    case "⬆": return 16
    case "，。？！": return 14
    case ". , :", ". . :": return 15
    case "^_^": return 15
    default: break
    }
    if spec.isInputAction {
      // 9键面板小字号；英文/10列符号面板大字号
      if currentPanel == .pinyin9 || currentPanel == .number || currentPanel == .numberMore {
        return 14
      }
      return 18
    }
    return 14
  }''', '''  private func overlayFontSize(for spec: IOSNativeKey) -> CGFloat {
    if spec.isSend { return 16 }
    if spec.action == .primary(.return) { return 16 }
    let text = spec.displayText ?? ""
    switch text {
    case "⌫": return 17
    case "空格", "space": return 16
    case "😀": return 20
    case "⬆": return 17
    case "，。？！": return 15
    case ". , :", ". . :": return 16
    case "^_^": return 16
    default: break
    }
    if spec.isInputAction {
      // Apple 10-key labels are smaller than QWERTY, while QWERTY letters use the large system-key cap size.
      if currentPanel == .pinyin9 || currentPanel == .number || currentPanel == .numberMore {
        return 17
      }
      return 22
    }
    return 15
  }''')

          replace_once(view, '''    label.font = UIFont.systemFont(ofSize: overlayFontSize(for: spec))
    label.textColor = colors.foreground''', '''    label.font = UIFont.systemFont(ofSize: overlayFontSize(for: spec), weight: .regular)
    label.textColor = colors.foreground''')

          replace_once(view, '''  // MARK: - 覆盖层配色刷新

  /// 统一刷新所有覆盖层配色（深浅色切换 / rebuild 后调用）''', '''  // MARK: - 覆盖层配色刷新

  /// 系统键盘键帽有一条非常轻的底部阴影；原生模式统一由这里维护，深浅色切换时同步更新。
  private func refreshKeyShadows() {
    for entry in entries {
      entry.button.layer.shadowColor = palette.keyShadow.cgColor
      entry.button.layer.shadowOpacity = IOSNativeDesign.keyShadowOpacity
      entry.button.layer.shadowOffset = CGSize(width: 0, height: IOSNativeDesign.keyShadowOffsetY)
      entry.button.layer.shadowRadius = IOSNativeDesign.keyShadowRadius
    }
  }

  /// 统一刷新所有覆盖层配色（深浅色切换 / rebuild 后调用）''')

          replace_once(view, '''      label.font = UIFont.systemFont(ofSize: overlayFontSize(for: entry.spec) * sx)
''', '''      label.font = UIFont.systemFont(ofSize: overlayFontSize(for: entry.spec) * sx, weight: .regular)
''')

          root = "Packages/HamsterKeyboardKit/Sources/View/KeyboardRootView.swift"
          replace_once(root, '''  override func setupAppearance() {
    backgroundColor = appearance.backgroundStyle.backgroundColor
    contentMode = .redraw
  }''', '''  override func setupAppearance() {
    if keyboardContext.useIOSNativeLayout {
      backgroundColor = IOSNativePalette.current(dark: keyboardContext.hasDarkColorScheme).board
    } else {
      backgroundColor = appearance.backgroundStyle.backgroundColor
    }
    contentMode = .redraw
  }''')

          controller = "Packages/HamsterKeyboardKit/Sources/Controller/KeyboardInputViewController.swift"
          replace_once(controller, '''  func syncKeyboardBackgroundColor() {
    let backgroundColor = keyboardAppearance.backgroundStyle.backgroundColor
    view.backgroundColor = backgroundColor
    inputView?.backgroundColor = backgroundColor
  }''', '''  func syncKeyboardBackgroundColor() {
    let backgroundColor: UIColor
    if keyboardContext.useIOSNativeLayout {
      backgroundColor = IOSNativePalette.current(dark: keyboardContext.hasDarkColorScheme).board
    } else {
      backgroundColor = keyboardAppearance.backgroundStyle.backgroundColor
    }
    view.backgroundColor = backgroundColor
    inputView?.backgroundColor = backgroundColor
  }''')
          PY

      - name: Validate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'keyShadowOpacity: Float = 0.32' Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeLayout.swift
          grep -q 'return 22' Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeKeyboardView.swift
          grep -q 'refreshKeyShadows()' Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeKeyboardView.swift
          grep -q 'keyShadow = iosRGB(0x868B93)' Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativePalette.swift
          grep -q 'keyboardContext.useIOSNativeLayout' Packages/HamsterKeyboardKit/Sources/View/KeyboardRootView.swift
          grep -q 'IOSNativePalette.current' Packages/HamsterKeyboardKit/Sources/Controller/KeyboardInputViewController.swift

      - name: Commit source changes and remove one-shot workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/claw-ios-native-tune-once.yml
          git add Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeLayout.swift \
                  Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativePalette.swift \
                  Packages/HamsterKeyboardKit/Sources/View/IOSNative/IOSNativeKeyboardView.swift \
                  Packages/HamsterKeyboardKit/Sources/View/KeyboardRootView.swift \
                  Packages/HamsterKeyboardKit/Sources/Controller/KeyboardInputViewController.swift
          git diff --cached --check
          git commit -m "fix: match iOS native keyboard appearance"
          git push origin HEAD:work/claw-voice-keyboard-bg

      - name: Dispatch signed IPA and startup smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST repos/${{ github.repository }}/actions/workflows/build-ipa.yml/dispatches -f ref=work/claw-voice-keyboard-bg
          gh api -X POST repos/${{ github.repository }}/actions/workflows/startup-smoke.yml/dispatches -f ref=work/claw-voice-keyboard-bg
